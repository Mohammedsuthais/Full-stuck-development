<html>
	<head>	<title> Input Tags </title>	</head>

	<body>
	
		<fieldset>
		
			<p>
				Your Certficate:
				<input type="file">
		   </p>
		
		</fieldset>


		<fieldset>
			<p>
			Date:
			<input type="date">

		</fieldset>

			<p>

			<p>

		<p>
				Week:
				<input type="week">
		   </p>
		

		
	</body>
</html>
